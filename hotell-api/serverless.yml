# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: magnfreid
# "service" is the name of this project. This will also be added to your AWS resource names.
service: hotell-api

provider:
  name: aws
  runtime: nodejs20.x
  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

functions:
  CreateBooking:
    handler: functions/CreateReservation/index.handler
    events:
      - httpApi:
          path: /
          method: POST


  DeleteBooking:
    handler: functions/DeleteReservation/index.handler
    events:
      - httpApi:
          path: /
          method: DELETE

  GetAllRooms:
    handler: functions/GetAllRooms/index.handler
    events:
      - httpApi:
          path: /
          method: GET


  GetAllBookings:
    handler: functions/GetAllReservations/index.handler
    events:
      - httpApi:
          path: /
          method: GET
