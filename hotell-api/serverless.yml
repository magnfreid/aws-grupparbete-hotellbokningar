# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ${env:ORG}
# "service" is the name of this project. This will also be added to your AWS resource names.
service: hotell-api

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-north-1
  iam:
    role: ${env:ROLE}


functions:
  CreateBooking:
    handler: functions/CreateReservation/index.handler
    events:
      - httpApi:
          path: /reservation
          method: POST


  DeleteBooking:
    handler: functions/DeleteReservation/index.handler
    events:
      - httpApi:
          path: /reservation/{id}
          method: DELETE

  GetAllRooms:
    handler: functions/GetAllRooms/index.handler
    events:
      - httpApi:
          path: /rooms
          method: GET


  GetAllBookings:
    handler: functions/GetAllReservations/index.handler
    events:
      - httpApi:
          path: /reservation
          method: GET
